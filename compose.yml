# En el VPS: /opt/apps/crm  →  docker compose up -d --build
services:
  crm:
    build: .
    container_name: crm
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@crm-db:5432/crm
    depends_on:
      crm-db:
        condition: service_healthy
    networks: [web, interna]

  crm-db:
    image: postgres:17-alpine
    container_name: crm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - crm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      retries: 10
    networks: [interna]

volumes:
  crm_db:

networks:
  web:
    external: true   # la red compartida con Caddy
  interna: {}        # la base no queda expuesta a otras apps
